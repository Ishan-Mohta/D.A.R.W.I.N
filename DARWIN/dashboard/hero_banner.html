<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background:  #d8f5cc;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 340px;
    background: #d8f5cc;
    overflow: hidden;
  }
  #terminalCanvas, #particleCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Particle layer sits on top, slightly transparent so terminal bleeds through */
  #particleCanvas {
    z-index: 2;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="terminalCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>
</div>

<!-- ogl for the terminal shader -->
<script type="module">
import { Renderer, Program, Mesh, Color, Triangle } from 'https://unpkg.com/ogl@1.0.11/src/index.js';

// ---------- FAULTY TERMINAL SHADER (ported from React Bits) ----------
const vert = `
attribute vec2 position;
attribute vec2 uv;
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}`;

const frag = `
precision mediump float;
varying vec2 vUv;
uniform float iTime;
uniform vec3  iResolution;
uniform float uScale;
uniform vec2  uGridMul;
uniform float uDigitSize;
uniform float uScanlineIntensity;
uniform float uGlitchAmount;
uniform float uFlickerAmount;
uniform float uNoiseAmp;
uniform float uCurvature;
uniform vec3  uTint;
uniform float uBrightness;
float time;

float hash21(vec2 p){
  p = fract(p * 234.56);
  p += dot(p, p + 34.56);
  return fract(p.x * p.y);
}
float noise(vec2 p){
  return sin(p.x * 10.0) * sin(p.y * (3.0 + sin(time * 0.090909))) + 0.2;
}
mat2 rotate(float a){
  float c = cos(a); float s = sin(a);
  return mat2(c, -s, s, c);
}
float fbm(vec2 p){
  p *= 1.1;
  float f = 0.0;
  float amp = 0.5 * uNoiseAmp;
  f += amp * noise(p); p = rotate(time*0.02) * p * 2.0; amp *= 0.4545;
  f += amp * noise(p); p = rotate(time*0.02) * p * 2.0; amp *= 0.4545;
  f += amp * noise(p);
  return f;
}
float pattern(vec2 p, out vec2 q, out vec2 r){
  vec2 o1 = vec2(1.0);
  vec2 o0 = vec2(0.0);
  q = vec2(fbm(p + o1), fbm(rotate(0.1*time) * p + o1));
  r = vec2(fbm(rotate(0.1) * q + o0), fbm(q + o0));
  return fbm(p + r);
}
float digit(vec2 p){
  vec2 grid = uGridMul * 15.0;
  vec2 s = floor(p * grid) / grid;
  p = p * grid;
  vec2 q, r;
  float intensity = pattern(s * 0.1, q, r) * 1.3 - 0.03;
  p = fract(p);
  p *= uDigitSize;
  float px5 = p.x * 5.0;
  float py5 = (1.0 - p.y) * 5.0;
  float x = fract(px5);
  float y = fract(py5);
  float i = floor(py5) - 2.0;
  float j = floor(px5) - 2.0;
  float n = i*i + j*j;
  float f = n * 0.0625;
  float isOn = step(0.1, intensity - f);
  float brightness = isOn * (0.2 + y*0.8) * (0.75 + x*0.25);
  return step(0.0, p.x)*step(p.x,1.0)*step(0.0,p.y)*step(p.y,1.0)*brightness;
}
float onOff(float a, float b, float c){
  return step(c, sin(iTime + a * cos(iTime * b))) * uFlickerAmount;
}
float displace(vec2 look){
  float y = look.y - mod(iTime * 0.25, 1.0);
  float window = 1.0 / (1.0 + 50.0 * y * y);
  return sin(look.y*20.0 + iTime)*0.0125*onOff(4.0,2.0,0.8)*(1.0+cos(iTime*60.0))*window;
}
vec3 getColor(vec2 p){
  float bar = step(mod(p.y + time*20.0, 1.0), 0.2) * 0.4 + 1.0;
  bar *= uScanlineIntensity;
  float displacement = displace(p);
  p.x += displacement;
  float middle = digit(p);
  const float off = 0.002;
  float sum = digit(p+vec2(-off,-off)) + digit(p+vec2(0.0,-off)) + digit(p+vec2(off,-off)) +
              digit(p+vec2(-off,0.0))  + digit(p+vec2(0.0,0.0))  + digit(p+vec2(off,0.0))  +
              digit(p+vec2(-off,off))  + digit(p+vec2(0.0,off))  + digit(p+vec2(off,off));
  return vec3(0.9)*middle + sum*0.1*vec3(1.0)*bar;
}
vec2 barrel(vec2 uv){
  vec2 c = uv*2.0 - 1.0;
  float r2 = dot(c,c);
  c *= 1.0 + uCurvature * r2;
  return c*0.5 + 0.5;
}
void main(){
  time = iTime * 0.333333;
  vec2 uv = vUv;
  if (uCurvature != 0.0) uv = barrel(uv);
  vec2 p = uv * uScale;
  vec3 col = getColor(p);
  col *= uTint;
  col *= uBrightness;
  gl_FragColor = vec4(col, 1.0);
}`;

const terminalCanvas = document.getElementById('terminalCanvas');
const renderer = new Renderer({ canvas: terminalCanvas, dpr: Math.min(window.devicePixelRatio || 1, 2) });
const gl = renderer.gl;
gl.clearColor(0.039, 0.165, 0.059, 1);   // dark green #0a2a0f
const geometry = new Triangle(gl);

const program = new Program(gl, {
  vertex: vert,
  fragment: frag,
  uniforms: {
    iTime: { value: 0 },
    iResolution: { value: new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width/gl.canvas.height) },
    uScale: { value: 1.5 },
    uGridMul: { value: new Float32Array([2, 1]) },
    uDigitSize: { value: 1.2 },
    uScanlineIntensity: { value: 0.5 },
    uGlitchAmount: { value: 1 },
    uFlickerAmount: { value: 1 },
    uNoiseAmp: { value: 1 },
    uCurvature: { value: 0.1 },
    uTint: { value: new Color(0.65, 0.93, 0.62) },  // #A7EF9E
    uBrightness: { value: 0.6 }
  }
});

const mesh = new Mesh(gl, { geometry, program });

function resizeTerminal(){
  const wrap = document.getElementById('wrap');
  renderer.setSize(wrap.offsetWidth, wrap.offsetHeight);
  program.uniforms.iResolution.value = new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width/gl.canvas.height);
}
window.addEventListener('resize', resizeTerminal);
resizeTerminal();

let t0 = performance.now();
function loopTerminal(t){
  const elapsed = (t - t0) * 0.001 * 0.5;
  program.uniforms.iTime.value = elapsed;
  renderer.render({ scene: mesh });
  requestAnimationFrame(loopTerminal);
}
requestAnimationFrame(loopTerminal);
</script>

<!-- Particle D.A.R.W.I.N layer -->
<script>
(function(){
  const TEXT = "D.A.R.W.I.N";
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    const wrap = document.getElementById('wrap');
    canvas.width  = wrap.offsetWidth  * dpr;
    canvas.height = wrap.offsetHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function sampleText(text, width, height){
    const off = document.createElement('canvas');
    off.width = width; off.height = height;
    const octx = off.getContext('2d');
    const fontSize = Math.min(height * 0.5, width / (text.length * 0.75));
    octx.fillStyle = '#ffffff';
    octx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(text, width/2, height/2);
    const data = octx.getImageData(0,0,width,height).data;
    const pts = [];
    const step = 3;
    for (let y=0; y<height; y+=step){
      for (let x=0; x<width; x+=step){
        if (data[(y*width+x)*4+3] > 128) pts.push({x,y});
      }
    }
    return pts;
  }

  const COLORS = ['#d8f5cc','#c5e8b8','#b8e0a8','#e5f5dc'];
  const particles = [];

  function init(){
    resize();
    const w = canvas.width  / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const pts = sampleText(TEXT, w, h);
    particles.length = 0;
    pts.forEach(p => {
      particles.push({
        x: Math.random()*w, y: Math.random()*h,
        tx: p.x, ty: p.y,
        vx: 0, vy: 0,
        r: 0.8 + Math.random()*0.7,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        pull: 0.05 + Math.random()*0.04
      });
    });
  }

  let t = 0;
  function animate(){
    const w = canvas.width  / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0,0,w,h);
    t += 0.01;
    particles.forEach(p => {
      p.vx += (p.tx - p.x) * p.pull * 0.15;
      p.vy += (p.ty - p.y) * p.pull * 0.15;
      p.vx += Math.sin(t + p.tx*0.01) * 0.02;
      p.vy += Math.cos(t + p.ty*0.01) * 0.02;
      p.vx *= 0.92; p.vy *= 0.92;
      p.x += p.vx;  p.y += p.vy;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', init);
  init();
  animate();
})();
</script>
</body>
</html>
